<body>
  <div id="root">Корневой элемент</div>

    const root = ReactDOM.createRoot(container);
    root.render(<App />);
    
    function App() {
      const isFinished = true;
      const isShow = true;
      return (
        <section className="game container">
          <ul className="cards cards-theme-cars">
            <CardImage isShow url="img/cats-1.jpg" />
            <CardImage url="img/cats-1.jpg" />
            <CardImage url="img/cats-1.jpg" />
            <CardImage url="img/cats-1.jpg" />

            <CardImage isFinished url="img/cats-5.jpg" />
            <CardImage url="img/cats-1.jpg" />
            <CardImage url="img/cats-1.jpg" />
            <CardImage url="img/cats-1.jpg" />
            <CardImage url="img/cats-1.jpg" />
          </ul>
        </section>
      );
    }

      function CardImage({isFinished, isShow, url}) {
        return (
          <li className={`card ${isFinished ? 'card-finished': ''} ${isShow ? 'card-show' : ''}`}>
            <img src={url} width="204" height="144" alt="Котик"/>
          </li>
        );
