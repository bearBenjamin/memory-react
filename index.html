<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Игра Мемори</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/react.development.js"></script>
  <script src="vendor/react-dom.development.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script src="data.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App images={images} />);

    function App({ images = [] }) {
      const cards = images.map((item) => (
        <CardImage
          url={item.url}
          isFinished={item.id === 'YdAqiUkUoWA' || item.id === 'YdAqiUkUoWA1' || item.id === 'w1JE5duY62M' || item.id === 'w1JE5duY62M1'}
          isShow={item.id === 'hX_hf2lPpUU' || item.id === '3tYZjGSBwbk'}
          key={item.id}
        />
      )
      )
      return (
        <section className="game container">
          <ul className="cards cards-theme-cars">
            {cards}
          </ul>
        </section>
      );
    }

    function CardImage({ isFinished, isShow, url }) {
      console.log('isFinished: ', isFinished);
      return (
        <li className={`card ${isFinished ? 'card-finished' : ''} ${isShow ? 'card-show' : ''}`}>
          <img src={url} width="204" height="144" alt="Котик" />
        </li>
      );
    }

  </script>
</body>

</html>
