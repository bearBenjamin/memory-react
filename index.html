<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Игра Мемори</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/react.development.js"></script>
  <script src="vendor/react-dom.development.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script src="data.js"></script>
  <script src="settings.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App images={images} />);

    function App({ images = [] }) {
      const [page, setPage] = React.useState('results');

      const getPage = (route) => {
        if (route === 'game') {
          return <GamePage images={images} />;
        }

        if (route === 'results') {
          return <ResultsPage />;
        }

        return null;
      }

      return getPage(page);
    }

    function ResultsPage() {
      return (
        <section class="result container">
          <h2>Лучшие результаты:</h2>
          <p>Вы завершили игру за <b>16 шагов</b>, так держать!</p>
          <table class="result-table">
            <thead>
              <tr class="result-table-row">
                <th>Место</th>
                <th>Имя</th>
                <th>Шаги</th>
              </tr>
            </thead>
            <tbody>
              <tr class="result-table-row">
                <td>1</td>
                <td>Вася</td>
                <td>13</td>
              </tr>
              <tr class="result-table-row active">
                <td>2</td>
                <td>Ваш результат</td>
                <td>16</td>
              </tr>
              <tr class="result-table-row">
                <td>3</td>
                <td>Аня</td>
                <td>24</td>
              </tr>
              <tr class="result-table-row">
                <td>4</td>
                <td>Петя</td>
                <td>25</td>
              </tr>
              <tr class="result-table-row">
                <td>5</td>
                <td>Маша</td>
                <td>27</td>
              </tr>
            </tbody>
          </table>
          <p>Хотите попробовать ещё раз?</p>
          <button class="button result-button" type="button">Новая игра</button>
        </section>
      );
    }

    const useGame = (images) => {
      const [stepsCount, setStepsCount] = React.useState(0);
      const [finishedItems, setFinishedItems] = React.useState([]);

      const checkItems = (first, second) => {

        if (Math.abs(first.length - second.length) === 1) {
          if (first.slice(0, -1) === second) {
            setFinishedItems((items) => [...items, first, second])
          }
          if (first === second.slice(0, -1)) {
            setFinishedItems((items) => [...items, first, second]);
          }
        }

        setStepsCount((i) => i + 1);
      };

      const handleReset = () => {
        setFinishedItems([]);
        setStepsCount(0);
      };

      const sumPair = images.length / 2;
      const countFinishedItems = finishedItems.length / 2;
      const isGameOver = finishedItems.length === images.length;

      return {
        finishedItems,
        handleReset,
        stepsCount,
        checkItems,
        sumPair,
        countFinishedItems,
        isGameOver
      }
    }

    function GamePage({ images = [] }) {
      const {
        finishedItems,
        handleReset,
        stepsCount,
        checkItems,
        sumPair,
        countFinishedItems,
        isGameOver
      } = useGame(images);

      return (
        <section className="game container">
          <Progress value={finishedItems.length} max={images.length} />
          <p className="progress-description">Открыто <span>{countFinishedItems}</span> / <span>{sumPair}</span></p>
          <div className="steps">Шаг {stepsCount}</div>
          <Grid images={images} checkItems={checkItems} finishedItems={finishedItems} />
          {isGameOver && (<Modal className="modal-box">
            <h3 className="modal-caption">Победа!</h3>
            <p className="modal-description">Вы собрали все пары за {stepsCount} шагов</p>
            <button className="button modal-button" type="button" onClick={handleReset}>Новая игра</button>
          </Modal>)}
        </section>
      );
    }

    function Progress({ value, max }) {
      return (
        <div className="progress-wrapper">
          <div className="progress" style={{ width: `${value / max * 100}%` }}></div>
        </div>
      )
    }

    function Modal({ children, className }) {
      return (
        <div className="modal">
          <div className={className}>
            {children}
          </div>
        </div>
      )
    }

    function Grid({ images = [], checkItems, finishedItems }) {
      const [visibleItems, setVisibleItems] = React.useState([]);

      const handleCardClick = (id) => {
        if (visibleItems.includes(id) || finishedItems.includes(id)) {
          return;
        }

        switch (visibleItems.length) {
          case 0:
            setVisibleItems([id]);
            break;
          case 1:
            setVisibleItems((items) => [...items, id]);
            checkItems(visibleItems[0], id);
            setTimeout(() => {
              setVisibleItems([]);
            }, TIMEOUT);
            break;
          default:
            setVisibleItems([]);
        }
      };

      return (
        <ul className="cards">
          {images.map((item) => (
            <Card
              key={item.id}
              item={item}
              isVisible={visibleItems.includes(item.id)}
              isFinished={finishedItems.includes(item.id)}
              onCardClick={handleCardClick}
            />
          ))}
        </ul>
      );
    }

    function Card({ item, isVisible, isFinished, onCardClick }) {
      const { id, url, description } = item;
      // TODO: добавьте обработку события
      const handleClick = () => {
        onCardClick(id);
      };
      const className = `${isVisible ? 'card-show' : ''
        } ${isFinished ? 'card-finished' : ''
        }`;
      return (
        <li className={`card ${className}`} onClick={handleClick}>
          <img
            width="204" height="144"
            src={url}
            alt={description}
          />
        </li>
      );
    }
  </script>
</body>

</html>
